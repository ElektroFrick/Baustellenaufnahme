name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Web-App bauen und ins Android-Projekt kopieren
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Signaturschlüssel aus den Secrets anlegen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD fehlen"
            exit 1
          fi
          mkdir -p android/signing
          echo "$KEYSTORE_BASE64" | base64 -d > android/signing/release.jks
          {
            echo "storeFile=../signing/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=baustellenaufnahme"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/signing/signing.properties

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Baustellenaufnahme.apk

      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" Baustellenaufnahme.apk \
            --title "Baustellenaufnahme $VERSION_NAME" \
            --notes "$(git log -1 --pretty=%s)" \
            --latest
